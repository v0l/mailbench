[package]
name = "mailbench"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A keyboard-first desktop mail client for builders"
repository = "https://github.com/v0l/mailbench"

[lib]
name = "mailbench"
path = "src/lib.rs"

[[bin]]
name = "mailbench"
path = "src/main.rs"

[dependencies]
egui = "0.37"
egui_bench = "0.10"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "clipboard", "links", "x11"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
