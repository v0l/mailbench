[package]
name = "mailbench"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A keyboard-first desktop mail client for builders"
repository = "https://github.com/v0l/mailbench"

[lib]
name = "mailbench"
path = "src/lib.rs"

[[bin]]
name = "mailbench"
path = "src/main.rs"

[dependencies]
egui = "0.37"
egui_bench = "0.10"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "clipboard", "links", "x11"] }

chacha20poly1305 = "0.10"
argon2 = "0.5"
rusqlite = { version = "0.32", features = ["bundled"] }
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "native-tls", "hostname", "tokio1", "tokio1-native-tls"] }
mail-parser = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "2"
base64 = "0.22"
open = "5"
roxmltree = "0.20"
dirs = "6"
scraper = "0.23"
ego-tree = "0.10"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-native-tls = "0.3"
futures = "0.3"
async-trait = "0.1"
native-tls = "0.2"

[dev-dependencies]
tempfile = "3"
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
