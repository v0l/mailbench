name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, publishes nothing"
        required: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Tag matches version and changelog
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          [ "${tag#v}" = "$version" ] || { echo "tag $tag is not version $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $version"; exit 1; }

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev libwayland-dev libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          name=mailbench-${tag}-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp README.md LICENSE "dist/$name/"
          cp -r skills "dist/$name/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "../target/${{ matrix.target }}/release/mailbench.exe" "$name/"
            7z a "$name.zip" "$name" >/dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            cp "../target/${{ matrix.target }}/release/mailbench" "$name/"
            tar czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - name: deb
        if: runner.os == 'Linux'
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          cargo install cargo-deb --locked
          cargo deb --no-build --target ${{ matrix.target }} --deb-version "${tag#v}" --output "dist/mailbench-${tag}-${{ matrix.target }}.deb"
          (cd dist && sha256sum "mailbench-${tag}-${{ matrix.target }}.deb" > "mailbench-${tag}-${{ matrix.target }}.deb.sha256")
      - name: dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          app="dmg/Mailbench.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          sed "s/__VERSION__/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          cp "target/${{ matrix.target }}/release/mailbench" "$app/Contents/MacOS/"
          cp packaging/macos/icon.icns "$app/Contents/Resources/"
          codesign --force --deep --sign - "$app"
          ln -s /Applications dmg/Applications
          name=mailbench-${tag}-${{ matrix.target }}
          hdiutil create -volname "Mailbench" -srcfolder dmg -fs HFS+ -format UDZO -ov "dist/$name.dmg"
          (cd dist && shasum -a 256 "$name.dmg" > "$name.dmg.sha256")
      - name: install wix
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 5.0.2
      - name: msi
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          name=mailbench-${tag}-${{ matrix.target }}
          wix build -arch x64 -pdbtype none \
            -d "Version=$(echo "$version" | sed -E 's/[-+].*$//')" \
            -d "BinDir=target/${{ matrix.target }}/release" \
            -o "dist/$name.msi" packaging/windows/mailbench.wxs
          (cd dist && sha256sum "$name.msi" > "$name.msi.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: mailbench-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*.msi
            dist/*.deb
            dist/*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '/^## \[/{p=index($0,"[" v "]")>0;next} /^\[[^]]*\]: /{p=0} p' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no entry for ${TAG#v}"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Source archive
        run: |
          name=mailbench-${GITHUB_REF_NAME}-source.tar.gz
          git ls-files --recurse-submodules -z | tar --null -T - --transform "s,^,mailbench-${GITHUB_REF_NAME}/," -czf "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
      - name: Sums
        run: (cd dist && sha256sum $(ls | grep -v '\.sha256$') > SHA256SUMS)
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file notes.md
